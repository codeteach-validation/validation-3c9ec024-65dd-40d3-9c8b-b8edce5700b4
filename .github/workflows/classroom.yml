name: Autograding Tests

on:
  push:
    branches: [ main, solution ]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: test1syntaxcheck
      id: test1syntaxcheck
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Test 1: Syntax Check"
        command: python3 -c "import json; json.load(open('ITAI1378 - Assignment 1.ipynb'))"
        timeout: 60
        max-score: 9

    - name: test2libraryimportcheck
      id: test2libraryimportcheck
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Test 2: Library Import Check"
        command: jupyter nbconvert --to notebook --execute ITAI1378 - Assignment 1.ipynb --stdout
        timeout: 60
        max-score: 9

    - name: test3imagedownloadcheck
      id: test3imagedownloadcheck
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Test 3: Image Download Check"
        command: jupyter nbconvert --to notebook --execute ITAI1378 - Assignment 1.ipynb --stdout
        timeout: 60
        max-score: 9

    - name: test4imageloadcheck
      id: test4imageloadcheck
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Test 4: Image Load Check"
        command: jupyter nbconvert --to notebook --execute ITAI1378 - Assignment 1.ipynb --stdout
        timeout: 60
        max-score: 9

    - name: test5imagetypeandshapecheck
      id: test5imagetypeandshapecheck
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Test 5: Image Type and Shape Check"
        command: jupyter nbconvert --to notebook --execute ITAI1378 - Assignment 1.ipynb --stdout
        timeout: 60
        max-score: 9

    - name: test6imageconversioncheck
      id: test6imageconversioncheck
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Test 6: Image Conversion Check"
        command: jupyter nbconvert --to notebook --execute ITAI1378 - Assignment 1.ipynb --stdout
        timeout: 60
        max-score: 9

    - name: test7rgbimagedisplaycheck
      id: test7rgbimagedisplaycheck
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Test 7: RGB Image Display Check"
        command: jupyter nbconvert --to notebook --execute ITAI1378 - Assignment 1.ipynb --stdout
        timeout: 60
        max-score: 9

    - name: test8rgbchannelsdisplaycheck
      id: test8rgbchannelsdisplaycheck
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Test 8: RGB Channels Display Check"
        command: jupyter nbconvert --to notebook --execute ITAI1378 - Assignment 1.ipynb --stdout
        timeout: 60
        max-score: 9

    - name: test9finalreflectioncheck
      id: test9finalreflectioncheck
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: "Test 9: Final Reflection Check"
        command: python3 -c "import json,sys; nb=json.load(open(sys.argv[1], encoding='utf-8')); print('\n'.join((''.join(cell.get('source', [])) if isinstance(cell.get('source'), list) else str(cell.get('source', ''))) for cell in nb.get('cells', [])))" 'ITAI1378 - Assignment 1.ipynb'
        timeout: 60
        max-score: 28

    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        TEST1SYNTAXCHECK_RESULTS: "${{ steps.test1syntaxcheck.outputs.result }}"
        TEST2LIBRARYIMPORTCHECK_RESULTS: "${{ steps.test2libraryimportcheck.outputs.result }}"
        TEST3IMAGEDOWNLOADCHECK_RESULTS: "${{ steps.test3imagedownloadcheck.outputs.result }}"
        TEST4IMAGELOADCHECK_RESULTS: "${{ steps.test4imageloadcheck.outputs.result }}"
        TEST5IMAGETYPEANDSHAPECHECK_RESULTS: "${{ steps.test5imagetypeandshapecheck.outputs.result }}"
        TEST6IMAGECONVERSIONCHECK_RESULTS: "${{ steps.test6imageconversioncheck.outputs.result }}"
        TEST7RGBIMAGEDISPLAYCHECK_RESULTS: "${{ steps.test7rgbimagedisplaycheck.outputs.result }}"
        TEST8RGBCHANNELSDISPLAYCHECK_RESULTS: "${{ steps.test8rgbchannelsdisplaycheck.outputs.result }}"
        TEST9FINALREFLECTIONCHECK_RESULTS: "${{ steps.test9finalreflectioncheck.outputs.result }}"
      with:
        runners: test1syntaxcheck,test2libraryimportcheck,test3imagedownloadcheck,test4imageloadcheck,test5imagetypeandshapecheck,test6imageconversioncheck,test7rgbimagedisplaycheck,test8rgbchannelsdisplaycheck,test9finalreflectioncheck
